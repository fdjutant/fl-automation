---
- name: Standardise and Deploy Fedora Lane Web Fleet
  hosts: all
  become: true

  tasks:
    - name: Ensure Apache HTTP Server is installed
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Deploy Fedora Lane landing page
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'

    - name: Ensure Apache service is enabled and running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
